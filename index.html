<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101614">
<title>TRU DRAIN</title>
<style>
:root{--bg:#101614;--ink:#e7f3ee;--dim:#9ab4aa;--line:#24342e;--water:#8ecfb8;--card:#182420}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--water)}
.sub{color:var(--dim);font-size:13px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0c1210;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--water);color:#10201c;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--water);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>DRAIN</span></h1><p class="sub">Slope, trap, vent, sewage. US model code figures. Not a whole-house design.</p></header>
<div class="bar"><input id="q" placeholder="trap, slope, sewer…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{t:"Slope",d:"In the International Plumbing Code, horizontal drainage pipe 2 1/2 inches and smaller falls at least 1/4 inch per foot. Pipe 3 to 6 inches falls at least 1/8 inch per foot. 8 inches and larger, at least 1/16 inch per foot. Water does not climb."},
{t:"Trap",d:"A P-trap holds a water seal so sewer gas does not come back up the fixture. If the seal is siphoned out, the room smells. The vent is what keeps the seal."},
{t:"Vent",d:"The vent lets air in so the trap is not sucked dry. IPC table for the distance from trap to vent: 1 1/4 inch trap, 5 feet at 1/4 inch per foot. 1 1/2 inch, 6 feet. 2 inch, 8 feet. 3 inch, 12 feet at 1/8. 4 inch, 16 feet at 1/8. A water closet is the exception. Its distance is not limited that way."},
{t:"Do not shrink the pipe",d:"Drainage pipe is not reduced in the direction of flow. A smaller pipe downstream is a clog waiting. Grease and wipes are not sewage. They stop the line."},
{t:"Sewage",d:"Sewage goes downhill to a sewer or a septic tank. Storm water and sanitary sewage are different pipes. A setback from a well or a creek is local health-department law. This card does not invent that distance."},
{t:"Gap",d:"No packed septic size, no packed well distance, no packed fixture-unit table. Those are the full code and the county. Drinking water doses are on TRU Water."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(x){return `<article class="card"><div class="k">DRAIN</div><div class="big">${esc(x.t)}</div><div>${esc(x.d)}</div><div class="src">2024 IPC slope table and trap-to-vent distances. Local code can be stricter.</div></article>`;}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("");}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} const h=C.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q)); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No invented septic size or well setback.</div></article>`;}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
